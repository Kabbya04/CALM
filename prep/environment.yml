# CALM conda environment (Python 3.10 + PyTorch CUDA 12.4 wheels).
#
# Create / update on the target machine:
#   conda env create -f environment.yml
#   conda activate CALM
#
# Or recreate from scratch:
#   conda env remove -n CALM -y
#   conda env create -f environment.yml
#
#
# If cu124 wheels fail (older driver), change the extra-index-url to
#   https://download.pytorch.org/whl/cu121
# or
#   https://download.pytorch.org/whl/cu118
# and re-run: conda env update -f environment.yml --prune

name: CALM
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch
      - torchvision
      - torchaudio
      - transformers>=4.41.0,<5
      - Pillow>=10.0.0
      - numpy>=1.26.0,<2.1
      - tqdm>=4.65.0
      - scikit-learn>=1.3.0
      - timm>=0.9.0
      - pandas>=2.0.0
